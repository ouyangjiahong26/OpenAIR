schemaVersion: workflow-definition.v2
workflowId: pvd_process_optimization_workflow
workflowVersion: 4
nameZh: PVD 工艺优化研究
nameEn: PVD Process Optimization Research
description: 固定 PVD 下一轮实验决策所需的专业研究职责；核心职责形成候选方向→贝叶斯模型推荐候选参数→可行性核验→本轮推荐决策链。贝叶斯模型推荐候选参数是确定性节点：首轮以历史基线数据集现场训练高斯过程代理模型出候选，反馈轮叠加同体系真实实验观测重新训练再推荐；实验体系与模型不符时如实记录为不适用，不阻塞下游。两项条件职责仅在对应判断需要时进入。
