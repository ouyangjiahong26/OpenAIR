# OpenAIR 公开仓轻量 CI：前端构建与全历史密钥扫描。
# 完整 PR 门禁在 required-checks.yml；tag 发布在 release.yml。
# action 全部按 commit SHA 固定，gitleaks 下载校验 SHA-256。
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openair/web build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3 with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.24.3"
          asset="gitleaks_8.24.3_linux_x64.tar.gz"
          curl -sSL "${base}/${asset}" -o "$RUNNER_TEMP/${asset}"
          curl -sSL "${base}/gitleaks_8.24.3_checksums.txt" -o "$RUNNER_TEMP/gitleaks-checksums.txt"
          (cd "$RUNNER_TEMP" && grep "${asset}" gitleaks-checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/${asset}" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 0755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --redact -v
